name: Rapport quotidien Equilibre

on:
  schedule:
    # Heures UTC. Brazzaville est à UTC+1, donc on retire une heure.
    - cron: '0 5 * * *'    # 06h00 
    - cron: '0 11 * * *'   # 12h00
    - cron: '0 18 * * *'   # 19h00
    - cron: '0 21 * * *'   # 21h00
    
  workflow_dispatch:

permissions:
  contents: write   # pour enregistrer l'état du dernier rapport

jobs:
  rapport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Envoyer le rapport sur Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: python .github/scripts/rapport.py

      - name: Enregistrer l'etat
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .github/etat-rapport.json
          git diff --staged --quiet || git commit -m "Etat du rapport"
          git push
